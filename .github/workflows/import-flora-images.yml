name: Import approved Flora product imagery
on:
  push:
    paths:
      - .github/workflows/import-flora-images.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved collaboration artwork
        env:
          FULL_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:1086/quality:100/uri:ifs%3A%2F%2FM%2F2bec5ba2-ff77-46e4-a407-fe3642b62688/watermark:F/width:1448?csig=AAAAAAAAAAAAAAAAAAAAAGL8xCVbRC5n8WOB4t3dFVXWOGqIm6i10c6VUrUpcsTt&exp=1794056065&osig=AAAAAAAAAAAAAAAAAAAAAJk9NlWid6ImDEXCKeYVJbu71hnvYvQjJWoQPhHMGd2v&signer=media-rpc&token=AAIAAU0AJDJiZWM1YmEyLWZmNzctNDZlNC1hNDA3LWZlMzY0MmI2MjY4OAAAAAABobYTD-hMDKQ8QhQu3JM4PZdwDT41SUUi05iF5kr2Xka-lAfvew&x-canva-quality=thumbnail"
          FALLBACK_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:150/quality:100/uri:ifs%3A%2F%2FM%2F2bec5ba2-ff77-46e4-a407-fe3642b62688/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAGL8xCVbRC5n8WOB4t3dFVXWOGqIm6i10c6VUrUpcsTt&exp=1794056065&osig=AAAAAAAAAAAAAAAAAAAAAJk9NlWid6ImDEXCKeYVJbu71hnvYvQjJWoQPhHMGd2v&signer=media-rpc&token=AAIAAU0AJDJiZWM1YmEyLWZmNzctNDZlNC1hNDA3LWZlMzY0MmI2MjY4OAAAAAABobYTD-hMDKQ8QhQu3JM4PZdwDT41SUUi05iF5kr2Xka-lAfvew&x-canva-quality=thumbnail"
        run: |
          set -eu
          mkdir -p assets
          if ! curl --fail --location --silent --show-error --retry 2 "$FULL_URL" -o assets/flora-collab.png; then
            echo "Full-resolution Canva preview unavailable; using signed fallback."
            curl --fail --location --silent --show-error --retry 2 "$FALLBACK_URL" -o assets/flora-collab.png
          fi
          file assets/flora-collab.png
          test "$(wc -c < assets/flora-collab.png)" -gt 1000
      - name: Commit approved imagery to repository
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/flora-collab.png
          if ! git diff --cached --quiet; then
            git commit -m "Add approved Flora × Anishy product imagery"
            git push
          fi
